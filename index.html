<script>
/* ===== SETTINGS ===== */
const API = 'https://hentaiocean.com'; // base URL of the Hentai Ocean API
const PROXY = '';   // optional CORS proxy prefix, e.g. 'https://your-worker.example.workers.dev/?url='
const FIRST = 36;   // titles whose details load before the page first draws
const MAXLOAD = 150;// max titles to load details for (covers, genres, descriptions)
const PAGE = 36;    // titles per "load more" step

/* ===== NETWORK ===== */
async function net(path, type = 'json'){
  const url = API + path, target = PROXY ? PROXY + encodeURIComponent(url) : url;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(target, { signal: ctl.signal });
    if (!r.ok) throw new Error('Server answered ' + r.status);
    return type === 'json' ? await r.json() : await r.text();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The request timed out');
    if (e instanceof TypeError) throw new Error('The browser blocked the request (CORS) or you are offline');
    throw e;
  } finally { clearTimeout(timer); }
}
const retry = async fn => { try { return await fn(); } catch (e) { return await fn(); } };
const nice = s => s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

/* ===== DATA LAYER ===== */
const SOURCE = {
  async index(){ // RSS feed: every slug + title
    const doc = new DOMParser().parseFromString(await net('/rss.xml', 'text'), 'text/xml');
    if (doc.querySelector('parsererror')) throw new Error('The RSS feed could not be read');
    const seen = new Set(), out = [];
    doc.querySelectorAll('item').forEach(i => {
      const l = (i.querySelector('link')?.textContent || '').trim().split('?')[0].replace(/\/+$/, '');
      const id = l.split('/').pop(); if (!id || seen.has(id)) return; seen.add(id);
      out.push({ id, t: (i.querySelector('title')?.textContent || '').trim() || nice(id) });
    });
    return out;
  },
  async details(slug){ // Fetch API
    const j = await net(`/api?action=hentai&slug=${encodeURIComponent(slug)}`);
    const i = j.info && j.info[0]; if (!i) return null;
    return { id: slug, t: i.videoname || nice(slug), d: (i.description || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim(),
      y: (i.releasedate || '').slice(0, 4), rel: i.releasedate || '', up: i.uploaddate || '',
      tags: (j.genres || []).map(g => g.genre), cover: i.coverimg ? `${API}/assets/cover/${i.coverimg}` : '', thumb: `${API}/thumbnail/${slug}.webp` };
  },
  embed: id => `${API}/embed/${encodeURIComponent(id)}` // Embed API
};
const DEMO = ['One','Two','Three','Four','Five','Six'].map((n, i) => ({ id: 'demo' + i, t: 'Placeholder ' + n, y: '2025', rel: '2025-01-0' + (i + 1), up: '', tags: [i % 2 ? 'Comedy' : 'Drama'], d: 'Shown only when the catalog can’t be loaded.', cover: '', thumb: '', full: 1 }));

function activityTick(){
  const now = Date.now(), elapsed = Math.min(30, Math.max(0, Math.floor((now - activityTickAt) / 1000)));
  activityTickAt = now;
  if (!elapsed || document.hidden || !$('#portal').hidden) return;
  const c = activityState(), watching = $('#pl').classList.contains('open') && playing;
  if (!watching && now - lastBrowseInput > 60000) return;
  let gained = 0;

    c.watchSeconds += elapsed;
    while (c.watchSeconds >= 120 && c.watchEarned < 100) { c.watchSeconds -= 120; c.watchEarned += 5; gained += 5; }
    if (c.watchEarned >= 100) c.watchSeconds = 0;
  } else {
    c.browseSeconds += elapsed;
    while (c.browseSeconds >= 180 && c.browseEarned < 20) { c.browseSeconds -= 180; c.browseEarned += 2; gained += 2; }
    if (c.browseEarned >= 20) c.browseSeconds = 0;
  }
  c.balance += gained;
  store.set(creditKey(), c);
  if (gained) syncCreditsToCloud();
  const labels = activityLabels(c);
  const b = $('#browse-progress'), w = $('#watch-progress');
  if (b) b.textContent = labels.browse;

}

async function searchCommunityGifs(form){
  const query = form.querySelector('[data-tenor-query]')?.value.trim();
  const results = form.querySelector('[data-tenor-results]');
  if (!query || !results) return;
  results.innerHTML = '<p>Searching Tenor…</p>';
  try {
    const response = await fetch(`/api/tenor/search?q=${encodeURIComponent(query)}`);
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `Tenor search failed (${response.status}).`);
    const gifs = Array.isArray(payload.gifs) ? payload.gifs : [];
    results.innerHTML = gifs.length
      ? gifs.map(gif => `<button type="button" data-tenor-select data-tenor-url="${esc(gif.url)}" data-tenor-title="${esc(gif.title)}"><img src="${esc(gif.preview)}" alt="" loading="lazy"><span>${esc(gif.title)}</span></button>`).join('')
      : '<p>No GIFs found. Try another search.</p>';
  } catch (error) {
    console.error('Could not search Tenor:', error);
    results.innerHTML = `<p>${esc(error.message || 'Could not search Tenor.')}</p>`;
  }
}

async function hentaiMirrors(id){

  const html = await response.text(), doc = new DOMParser().parseFromString(html, 'text/html');

  const match = script && script.textContent.match(/var jsondata\s*=\s*(\{[\s\S]*\})\s*;?\s*$/);

    catch (error) { return false; }

    const url = `https://${host}.hentaiocean.com/video/h264/${encodeURIComponent(videoName)}`;
    const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 8000);
    try { return { host, available: (await fetch(url, { method: 'HEAD', signal: controller.signal })).ok }; }
    catch (error) { return { host, error }; }
    finally { clearTimeout(timer); }
  }));
  const universalHost = heads.find(result => result.available)?.host;
  const servers = [{ value: 'furina', label: 'VIP Mirror 1 · Furina', url: vipURL.href }];

    await pool(need.slice(0, FIRST), 6, step); persistDb(); render();
    await pool(need.slice(FIRST), 4, step); persistDb(); setBar(1);
  } catch (e) {
    err = e.message || String(e);
    if (!order.length || demo) { DEMO.forEach(d => db.set(d.id, d)); order = DEMO.map(d => d.id); demo = true; }
    setBar(1); render();
  }
}
document.body.dataset.section = section;
document.body.dataset.live = SECTIONS[section].live ? '1' : '0';
$('#hq').placeholder = section === 'hentai' ? 'Search episodes' : section === 'live' ? 'Search live events' : 'Search ' + SECTIONS[section].name.toLowerCase();
$('#portal').hidden = !startOnPortal;
document.body.classList.toggle('lock', startOnPortal);
buildExplore(); detectDeviceLayout(); pickPortal(); render(); load(); restoreAccount();
loadManagedSources().then(() => { if (view === 'account' && adminPanelOpen) render(); }).catch(error => console.error('Could not load managed stream sources:', error));
setInterval(activityTick, 15000);
setInterval(() => {
  if (document.hidden || !$('#portal').hidden || $('#pl').classList.contains('open')) return;
  if (section === 'hentai') load();
  else if (section !== 'live' && SECTIONS[section].live && view === 'home' && !curPage()) { delete xc[section]; render(); xAfter(); }
}, 6 * 60 * 60 * 1000);
setInterval(() => {
  if (!document.hidden && $('#portal').hidden && section === 'live' && view === 'home' && !$('#pl').classList.contains('open') &&
      Date.now() - sports.fetchedAt >= SPORTS_CACHE_TTL && !sports.loading) loadSports();
}, SPORTS_CACHE_TTL);
</script>
